
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="origin" />
    <title>VerbaFlow - AI Terminology & Transcript Suite</title>
    
    <!-- SYSTEM POLYFILLS: Required for @google/genai SDK in browser environment -->
    <script>
      window.global = window;
      window.process = {
        env: { NODE_ENV: 'production' },
        version: '',
        nextTick: (cb) => setTimeout(cb, 0)
      };
    </script>
    <script type="module">
      import { Buffer } from "https://esm.sh/buffer@6.0.3";
      window.Buffer = Buffer;
    </script>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'class', 
        theme: {
          extend: {
            colors: {
              slate: {
                850: '#1e293b',
                900: '#0f172a',
                950: '#020617',
              }
            },
            animation: {
              'pulse-fast': 'pulse 1s cubic-bezier(0.4, 0, 0.6, 1) infinite',
            }
          }
        }
      }
    </script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="https://apis.google.com/js/api.js" async defer></script>
    
    <!-- CRITICAL FIX: explicit 'deps=react@18.2.0' prevents duplicate React instances -->
    <script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@18.2.0",
    "react/jsx-runtime": "https://esm.sh/react@18.2.0/jsx-runtime",

    "dexie": "https://esm.sh/dexie@4.0.8",
    "react/": "https://esm.sh/react@^19.2.3/",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/"
  }
}
</script>
</head>
